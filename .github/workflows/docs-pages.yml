name: Docs Pages

on:
  push:
    branches: [master]
    paths:
      - 'doc/**'
      - 'README.md'
      - '.github/workflows/docs-pages.yml'
      - 'test/docs_site_test.dart'
      - '.github/ci/check_readme_images.py'
      - '.github/ci/test_readme_images.py'
      - '.github/ci/requirements-readme-images.txt'
      - '.github/ci/docs_export.spec.mjs'
      - '.github/ci/docs_playwright.config.mjs'
      - '.github/ci/serve_docs_export.py'
      - '.github/ci/package*.json'
  pull_request:
    branches: [master]
    paths:
      - 'doc/**'
      - 'README.md'
      - '.github/workflows/docs-pages.yml'
      - 'test/docs_site_test.dart'
      - '.github/ci/check_readme_images.py'
      - '.github/ci/test_readme_images.py'
      - '.github/ci/requirements-readme-images.txt'
      - '.github/ci/docs_export.spec.mjs'
      - '.github/ci/docs_playwright.config.mjs'
      - '.github/ci/serve_docs_export.py'
      - '.github/ci/package*.json'
  workflow_dispatch:

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Validate and export docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r .github/ci/requirements-readme-images.txt
      - run: python3 -B -m unittest discover -s .github/ci -p 'test_readme_images.py'
      - name: Validate README image content
        run: >-
          python3 .github/ci/check_readme_images.py
          --github-page "https://github.com/${{ github.repository }}/blob/${{ github.sha }}/README.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: readme-image-content
          path: readme-images.json
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test test/docs_site_test.dart
      - run: node --test doc/scripts/prepare-github-pages.test.mjs
      - run: npm install -g mint@4.2.1040
      - run: mint validate
        working-directory: doc
      - run: mint broken-links
        working-directory: doc
      - run: mint export --output ../docs-export.zip
        working-directory: doc
      - run: |
          mkdir -p _site
          unzip -q docs-export.zip -d _site
          node doc/scripts/prepare-github-pages.mjs _site "/${{ github.event.repository.name }}"
      - run: npm ci --prefix .github/ci
      - run: npx --prefix .github/ci playwright install --with-deps chromium
      - name: Verify exported documentation in desktop and mobile browsers
        run: npx --prefix .github/ci playwright test --config .github/ci/docs_playwright.config.mjs
        env:
          RESTART_DOCS_RESULTS: ${{ runner.temp }}/restart_app_docs_results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: documentation-browser-evidence
          path: ${{ runner.temp }}/restart_app_docs_results
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
