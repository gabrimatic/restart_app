name: CI

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
      - 'analysis_options.yaml'
      - 'pubspec.yaml'
      - 'skills/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'example/**'
      - 'test/**'
      - '!test/docs_site_test.dart'
      - 'test_apps/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
      - 'analysis_options.yaml'
      - 'pubspec.yaml'
      - 'skills/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'example/**'
      - 'test/**'
      - '!test/docs_site_test.dart'
      - 'test_apps/**'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/ test/ example/lib/ example/test/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter test --platform chrome test/restart_web_test.dart
      - run: cd example && flutter pub get && flutter test

  build-android:
    name: Build Android example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd example && flutter pub get && flutter build apk

  build-android-agp9:
    name: Build Android on AGP ${{ matrix.agp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agp: '9.0.1'
            gradle: '9.1.0'
          - agp: '9.1.0'
            gradle: '9.5.0'
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The example app stays on AGP 8, so a fresh app pins the AGP 9 toolchain
      # instead. AGP 9 defaults to built-in Kotlin while the Flutter templates
      # still generate android.builtInKotlin=false, and that combination is what
      # broke the plugin in 1.9.0 (issue #56).
      - run: flutter create --platforms=android --project-name restart_app_agp9_smoke /tmp/restart_app_agp9_smoke
      - name: Pin AGP ${{ matrix.agp }} and Gradle ${{ matrix.gradle }}
        working-directory: /tmp/restart_app_agp9_smoke/android
        run: |
          settings=$(ls settings.gradle.kts settings.gradle 2>/dev/null | head -1)
          wrapper=gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's|(com\.android\.application"\)? version ")[0-9.]+"|\1${{ matrix.agp }}"|' "$settings"
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-${{ matrix.gradle }}-\1.zip#' "$wrapper"
          grep -qE 'com\.android\.application"\)? version "${{ matrix.agp }}"' "$settings"
          grep -qE 'gradle-${{ matrix.gradle }}-(all|bin)\.zip' "$wrapper"
          cat "$settings" "$wrapper" gradle.properties
      - run: cd /tmp/restart_app_agp9_smoke && flutter pub add restart_app --path "$GITHUB_WORKSPACE"
      - run: cd /tmp/restart_app_agp9_smoke && flutter build apk --debug

  build-web:
    name: Build web example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd example && flutter pub get && flutter build web

  build-linux:
    name: Build Linux example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter create --platforms=linux /tmp/restart_app_linux_smoke
      - run: cd /tmp/restart_app_linux_smoke && flutter pub add restart_app --path "$GITHUB_WORKSPACE"
      - run: cd /tmp/restart_app_linux_smoke && flutter build linux

  build-macos-ios:
    name: Build macOS and iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd example && flutter pub get && flutter build ios --no-codesign
      - run: flutter create --platforms=macos /tmp/restart_app_macos_smoke
      - run: cd /tmp/restart_app_macos_smoke && flutter pub add restart_app --path "$GITHUB_WORKSPACE"
      - run: cd /tmp/restart_app_macos_smoke && flutter build macos

  build-windows:
    name: Build Windows example
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows "$env:RUNNER_TEMP\restart_app_windows_smoke"
      - run: flutter pub add restart_app --path "$env:GITHUB_WORKSPACE"
        working-directory: ${{ runner.temp }}\restart_app_windows_smoke
      - run: flutter build windows
        working-directory: ${{ runner.temp }}\restart_app_windows_smoke

  run-linux:
    name: Linux restart proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - run: flutter create --platforms=linux --project-name restart_proof /tmp/restart_proof
      - run: cd /tmp/restart_proof && flutter pub add restart_app --path "$GITHUB_WORKSPACE"
      - run: cp "$GITHUB_WORKSPACE/.github/ci/restart_proof_main.dart" /tmp/restart_proof/lib/main.dart
      - run: cd /tmp/restart_proof && flutter build linux --release
      - name: Run app and verify a second instance wrote the proof
        run: |
          xvfb-run -a /tmp/restart_proof/build/linux/x64/release/bundle/restart_proof >/dev/null 2>&1 &
          for i in $(seq 1 45); do
            [ -f "$HOME/restart_app_ci_proof/restart_proof.txt" ] && break
            sleep 2
          done
          echo "--- restart_result ---"
          cat "$HOME/restart_app_ci_proof/restart_result.txt" || true
          echo "--- proof ---"
          cat "$HOME/restart_app_ci_proof/restart_proof.txt"
          grep -q RESTARTED_OK "$HOME/restart_app_ci_proof/restart_proof.txt"
          pkill -f restart_proof || true

  run-windows:
    name: Windows restart proof
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows --project-name restart_proof "$env:RUNNER_TEMP\restart_proof"
      - run: flutter pub add restart_app --path "$env:GITHUB_WORKSPACE"
        working-directory: ${{ runner.temp }}\restart_proof
      - run: Copy-Item "$env:GITHUB_WORKSPACE\.github\ci\restart_proof_main.dart" "lib\main.dart" -Force
        working-directory: ${{ runner.temp }}\restart_proof
      - run: flutter build windows --release
        working-directory: ${{ runner.temp }}\restart_proof
      - name: Run app and verify a second instance wrote the proof
        working-directory: ${{ runner.temp }}\restart_proof
        run: |
          $proofDir = "$env:USERPROFILE\restart_app_ci_proof"
          Start-Process "build\windows\x64\runner\Release\restart_proof.exe"
          for ($i = 0; $i -lt 45; $i++) {
            if (Test-Path "$proofDir\restart_proof.txt") { break }
            Start-Sleep -Seconds 2
          }
          Write-Host "--- restart_result ---"
          if (Test-Path "$proofDir\restart_result.txt") { Get-Content "$proofDir\restart_result.txt" }
          Write-Host "--- proof ---"
          Get-Content "$proofDir\restart_proof.txt"
          if (-not (Select-String -Path "$proofDir\restart_proof.txt" -Pattern "RESTARTED_OK" -Quiet)) { exit 1 }
          Stop-Process -Name restart_proof -Force -ErrorAction SilentlyContinue

  run-macos:
    name: macOS restart proof
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=macos --project-name restart_proof /tmp/restart_proof
      - run: cd /tmp/restart_proof && flutter pub add restart_app --path "$GITHUB_WORKSPACE"
      - run: cp "$GITHUB_WORKSPACE/.github/ci/restart_proof_main.dart" /tmp/restart_proof/lib/main.dart
      - run: cd /tmp/restart_proof && flutter build macos --debug
      - name: Run app and verify a second instance wrote the proof
        run: |
          open /tmp/restart_proof/build/macos/Build/Products/Debug/restart_proof.app
          # The default macOS app template is sandboxed, so HOME resolves to
          # the app container; check both locations.
          CONTAINER="$HOME/Library/Containers/com.example.restartProof/Data"
          for i in $(seq 1 45); do
            if [ -f "$CONTAINER/restart_app_ci_proof/restart_proof.txt" ] \
              || [ -f "$HOME/restart_app_ci_proof/restart_proof.txt" ]; then
              break
            fi
            sleep 2
          done
          PROOF="$HOME/restart_app_ci_proof/restart_proof.txt"
          [ -f "$CONTAINER/restart_app_ci_proof/restart_proof.txt" ] \
            && PROOF="$CONTAINER/restart_app_ci_proof/restart_proof.txt"
          echo "--- restart_result ---"
          cat "${PROOF%restart_proof.txt}restart_result.txt" || true
          echo "--- proof ---"
          cat "$PROOF"
          grep -q RESTARTED_OK "$PROOF"
          pkill -f restart_proof || true

  kotlin-format:
    name: Kotlin format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint && chmod +x ktlint
      - run: ./ktlint 'android/src/main/kotlin/**/*.kt'

  swift-format:
    name: Swift format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: xcrun swift-format lint --recursive ios/restart_app/Sources/ macos/restart_app/Sources/

  cpp-format:
    name: C++ format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get install -y clang-format
      - run: clang-format --dry-run --Werror linux/restart_app_plugin.cc windows/restart_app_plugin.cpp windows/restart_app_plugin_c_api.cpp

  skills:
    name: Package skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 .github/ci/check_skills.py

  publish-check:
    name: Publish check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
