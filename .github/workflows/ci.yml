name: CI

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
      - '.pubignore'
      - 'analysis_options.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'skills/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'example/**'
      - 'test/**'
      - '!test/docs_site_test.dart'
      - 'test_apps/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
      - '.pubignore'
      - 'analysis_options.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'skills/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'example/**'
      - 'test/**'
      - '!test/docs_site_test.dart'
      - 'test_apps/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate-package:
    name: Stage exact publication candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: flutter pub get
      - run: flutter pub publish --dry-run
      - name: Create and inventory the pub-selected archive
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-artifact"
          dart pub publish --to-archive="$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          python3 .github/ci/package_archive.py \
            "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz" \
            --manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact/
          if-no-files-found: error

  analyze:
    name: Analyze and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --set-exit-if-changed lib/ test/ example/lib/ example/test/
      - name: Kotlin format
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint && chmod +x ktlint
          ./ktlint 'android/src/main/kotlin/**/*.kt' 'android/src/test/kotlin/**/*.kt'
      - run: sudo apt-get install -y clang-format
      - name: C++ format
        run: clang-format --dry-run --Werror linux/*.cc linux/*.h windows/*.cpp windows/*.h
      - name: Check bounded Linux argument ownership with sanitizers
        run: |
          clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -g linux/restart_app_argv.cc linux/restart_app_argv_test.cc -o /tmp/restart_app_argv_test
          /tmp/restart_app_argv_test

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter test --platform chrome test/restart_web_test.dart
      - run: cd example && flutter pub get && flutter test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r .github/ci/requirements-readme-images.txt
      - run: python3 -B -m unittest discover -s .github/ci -p 'test_*.py'

  compatibility:
    name: Consumer ${{ matrix.label }} (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            flutter: '3.22.0'
            dart: '3.4'
          - label: swiftpm-transition
            flutter: '3.24.0'
            dart: '3.5'
          - label: dart-3.8
            flutter: '3.32.0'
            dart: '3.8'
          - label: swiftpm-default
            flutter: '3.44.0'
            dart: '3.12'
          - label: latest
            flutter: '3.47.7'
            dart: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: >-
          python3 .github/ci/check_compatibility.py
          --expected-flutter "${{ matrix.flutter }}"
          --expected-dart "${{ matrix.dart }}"
          --label "${{ matrix.label }}"

  build-android:
    name: Build Android example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd example && flutter pub get && flutter build apk

  build-android-consumers:
    name: Android consumer ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            flutter: '3.22.0'
            options: '--minimum --target-sdk 34'
          - label: current-target
            flutter: '3.47.7'
            options: '--target-sdk 37 --compile-minor 0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: python3 .github/ci/build_android_consumer.py "$RUNNER_TEMP/android_consumer" ${{ matrix.options }}
      - name: Verify native Android restart recovery
        if: matrix.label == 'current-target'
        working-directory: ${{ runner.temp }}/android_consumer/android
        run: ./gradlew :restart_app:testDebugUnitTest --tests gabrimatic.info.restart.RestartPluginTest
      - uses: actions/upload-artifact@v7
        with:
          name: android-consumer-${{ matrix.label }}
          path: ${{ runner.temp }}/android_consumer/build/app/outputs/flutter-apk/app-debug.apk

  build-android-agp9:
    name: Build Android on AGP ${{ matrix.agp }} (built-in Kotlin=${{ matrix.built_in_kotlin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: '3.44.0'
            agp: '9.0.1'
            gradle: '9.1.0'
            built_in_kotlin: 'false'
          - flutter: '3.47.7'
            agp: '9.1.0'
            gradle: '9.5.0'
            built_in_kotlin: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      # The example app covers the Flutter template (AGP 9 with built-in Kotlin
      # disabled). Flutter 3.44 exercises the first AGP 9 template with the
      # legacy Kotlin Gradle Plugin, and Flutter 3.47 the built-in Kotlin path.
      - run: flutter create --platforms=android --project-name restart_app_agp9_smoke /tmp/restart_app_agp9_smoke
      - name: Pin AGP ${{ matrix.agp }} and Gradle ${{ matrix.gradle }}
        working-directory: /tmp/restart_app_agp9_smoke/android
        run: |
          settings=$(ls settings.gradle.kts settings.gradle 2>/dev/null | head -1)
          wrapper=gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's|(com\.android\.application"\)? version ")[0-9.]+"|\1${{ matrix.agp }}"|' "$settings"
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-${{ matrix.gradle }}-\1.zip#' "$wrapper"
          sed -i -E '/^android\.builtInKotlin=/d' gradle.properties
          echo 'android.builtInKotlin=${{ matrix.built_in_kotlin }}' >> gradle.properties
          grep -qE 'com\.android\.application"\)? version "${{ matrix.agp }}"' "$settings"
          grep -qE 'gradle-${{ matrix.gradle }}-(all|bin)\.zip' "$wrapper"
          grep -qE '^android\.builtInKotlin=${{ matrix.built_in_kotlin }}$' gradle.properties
          cat "$settings" "$wrapper" gradle.properties
      - run: cd /tmp/restart_app_agp9_smoke && flutter pub add restart_app --path "$GITHUB_WORKSPACE"
      - run: cd /tmp/restart_app_agp9_smoke && flutter build apk --debug

  build-web:
    name: Build web example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd example && flutter pub get && flutter build web

  run-linux:
    name: Linux restart proof
    needs: candidate-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Extract and verify the shared candidate
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --extract "$RUNNER_TEMP/restart_app_candidate"
          --manifest "$RUNNER_TEMP/desktop-proof/candidate-extracted.json"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - run: flutter create --platforms=linux --project-name restart_proof "$RUNNER_TEMP/restart_proof"
      - run: flutter pub add restart_app --path "$RUNNER_TEMP/restart_app_candidate"
        working-directory: ${{ runner.temp }}/restart_proof
      - run: cp "$GITHUB_WORKSPACE/.github/ci/restart_proof_main.dart" "$RUNNER_TEMP/restart_proof/lib/main.dart"
      - run: python3 .github/ci/prepare_linux_proof.py "$RUNNER_TEMP/restart_proof"
      - name: Verify the package origin before build
        run: >-
          python3 .github/ci/candidate_package.py "$RUNNER_TEMP/restart_proof"
          "$RUNNER_TEMP/restart_app_candidate" --platform linux
          > "$RUNNER_TEMP/desktop-proof/origin-before-build.txt"
      - run: flutter build linux --release
        working-directory: ${{ runner.temp }}/restart_proof
      - name: Verify the package origin after build
        run: >-
          python3 .github/ci/candidate_package.py "$RUNNER_TEMP/restart_proof"
          "$RUNNER_TEMP/restart_app_candidate" --platform linux
          > "$RUNNER_TEMP/desktop-proof/origin-after-build.txt"
      - name: Verify candidate bytes after build
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --verify-dir "$RUNNER_TEMP/restart_app_candidate"
          --manifest "$RUNNER_TEMP/desktop-proof/candidate-after-build.json"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - name: Stress native restarts and verify fresh state
        run: >-
          xvfb-run -a python3 .github/ci/run_desktop_proof.py
          "$RUNNER_TEMP/restart_proof/build/linux/x64/release/bundle/restart_proof"
          --cycles 30 --output "$RUNNER_TEMP/desktop-proof/desktop-proof.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restart-proof-linux
          path: ${{ runner.temp }}/desktop-proof/
          if-no-files-found: warn

  run-macos:
    name: Apple builds and macOS restart proof
    needs: candidate-package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift format
        run: xcrun swift-format lint --recursive ios/restart_app/Sources/ macos/restart_app/Sources/
      - uses: actions/download-artifact@v8
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Extract and verify the shared candidate
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --extract "$RUNNER_TEMP/restart_app_candidate"
          --manifest "$RUNNER_TEMP/desktop-proof/candidate-extracted.json"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - run: flutter create --platforms=macos --project-name restart_proof "$RUNNER_TEMP/restart_proof"
      - run: flutter pub add restart_app --path "$RUNNER_TEMP/restart_app_candidate"
        working-directory: ${{ runner.temp }}/restart_proof
      - run: cp "$GITHUB_WORKSPACE/.github/ci/restart_proof_main.dart" "$RUNNER_TEMP/restart_proof/lib/main.dart"
      - name: Verify the package origin before build
        run: >-
          python3 .github/ci/candidate_package.py "$RUNNER_TEMP/restart_proof"
          "$RUNNER_TEMP/restart_app_candidate" --platform macos
          > "$RUNNER_TEMP/desktop-proof/origin-before-build.txt"
      - run: flutter build macos --debug
        working-directory: ${{ runner.temp }}/restart_proof
      - name: Verify the package origin after build
        run: >-
          python3 .github/ci/candidate_package.py "$RUNNER_TEMP/restart_proof"
          "$RUNNER_TEMP/restart_app_candidate" --platform macos
          > "$RUNNER_TEMP/desktop-proof/origin-after-build.txt"
      - name: Verify candidate bytes after build
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --verify-dir "$RUNNER_TEMP/restart_app_candidate"
          --manifest "$RUNNER_TEMP/desktop-proof/candidate-after-build.json"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - name: Stress native restarts and verify fresh state
        run: >-
          python3 .github/ci/run_desktop_proof.py
          "$RUNNER_TEMP/restart_proof/build/macos/Build/Products/Debug/restart_proof.app"
          --cycles 30 --output "$RUNNER_TEMP/desktop-proof/desktop-proof.json"
      - name: Build the iOS example
        run: cd example && flutter pub get && flutter build ios --no-codesign
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restart-proof-macos
          path: ${{ runner.temp }}/desktop-proof/
          if-no-files-found: warn

  run-windows:
    name: Windows native tests and restart proof
    needs: candidate-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S windows/tests -B "$env:RUNNER_TEMP\restart_native_tests"
      - run: cmake --build "$env:RUNNER_TEMP\restart_native_tests" --config Release
      - run: ctest --test-dir "$env:RUNNER_TEMP\restart_native_tests" -C Release --output-on-failure
      - uses: actions/download-artifact@v8
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - name: Extract and verify the shared candidate
        run: >-
          python .github/ci/package_archive.py "$env:RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --extract "$env:RUNNER_TEMP/restart_app_candidate"
          --manifest "$env:RUNNER_TEMP/desktop-proof/candidate-extracted.json"
          --expected-manifest "$env:RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - run: flutter create --platforms=windows --project-name restart_proof "$env:RUNNER_TEMP/restart_proof"
      - run: flutter pub add restart_app --path "$env:RUNNER_TEMP/restart_app_candidate"
        working-directory: ${{ runner.temp }}/restart_proof
      - run: Copy-Item "$env:GITHUB_WORKSPACE/.github/ci/restart_proof_main.dart" "lib/main.dart" -Force
        working-directory: ${{ runner.temp }}/restart_proof
      - name: Verify the package origin before build
        run: >-
          python .github/ci/candidate_package.py "$env:RUNNER_TEMP/restart_proof"
          "$env:RUNNER_TEMP/restart_app_candidate" --platform windows
          > "$env:RUNNER_TEMP/desktop-proof/origin-before-build.txt"
      - run: flutter build windows --release
        working-directory: ${{ runner.temp }}/restart_proof
      - name: Verify the package origin after build
        run: >-
          python .github/ci/candidate_package.py "$env:RUNNER_TEMP/restart_proof"
          "$env:RUNNER_TEMP/restart_app_candidate" --platform windows
          > "$env:RUNNER_TEMP/desktop-proof/origin-after-build.txt"
      - name: Verify candidate bytes after build
        run: >-
          python .github/ci/package_archive.py "$env:RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --verify-dir "$env:RUNNER_TEMP/restart_app_candidate"
          --manifest "$env:RUNNER_TEMP/desktop-proof/candidate-after-build.json"
          --expected-manifest "$env:RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - name: Stress native restarts and verify fresh state
        run: >-
          python .github/ci/run_desktop_proof.py
          "$env:RUNNER_TEMP/restart_proof/build/windows/x64/runner/Release/restart_proof.exe"
          --cycles 30 --output "$env:RUNNER_TEMP/desktop-proof/desktop-proof.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restart-proof-windows
          path: ${{ runner.temp }}/desktop-proof/
          if-no-files-found: warn

  skills:
    name: Package skills
    needs: candidate-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact/
      - name: Extract and verify the publication candidate
        run: |
          mkdir -p "$RUNNER_TEMP/skills-proof"
          python3 .github/ci/package_archive.py \
            "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz" \
            --extract "$RUNNER_TEMP/restart_app_candidate" \
            --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json" \
            --manifest "$RUNNER_TEMP/skills-proof/candidate-before.json"
      - name: Install bundled skills twice and analyze their examples
        run: |
          set -o pipefail
          python3 .github/ci/check_skills.py \
            --package-dir "$RUNNER_TEMP/restart_app_candidate" \
            2>&1 | tee "$RUNNER_TEMP/skills-proof/skills.log"
      - name: Verify the candidate remained unchanged
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --verify-dir "$RUNNER_TEMP/restart_app_candidate"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
          --manifest "$RUNNER_TEMP/skills-proof/candidate-after.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: skills-proof
          path: ${{ runner.temp }}/skills-proof/
          if-no-files-found: warn
