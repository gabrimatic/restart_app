name: CI

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
      - '.pubignore'
      - 'analysis_options.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'skills/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'example/**'
      - 'test/**'
      - '!test/docs_site_test.dart'
      - 'test_apps/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
      - '.pubignore'
      - 'analysis_options.yaml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'skills/**'
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'example/**'
      - 'test/**'
      - '!test/docs_site_test.dart'
      - 'test_apps/**'
  workflow_dispatch:

jobs:
  candidate-package:
    name: Stage exact publication candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: flutter pub get
      - run: flutter pub publish --dry-run
      - name: Create and inventory the pub-selected archive
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-artifact"
          dart pub publish --to-archive="$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          python3 .github/ci/package_archive.py \
            "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz" \
            --manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact/
          if-no-files-found: error

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib/ test/ example/lib/ example/test/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter test --platform chrome test/restart_web_test.dart
      - run: cd example && flutter pub get && flutter test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 -m pip install -r .github/ci/requirements-readme-images.txt
      - run: python3 -B -m unittest discover -s .github/ci -p 'test_*.py'

  compatibility:
    name: Consumer ${{ matrix.label }} (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            flutter: '3.22.0'
            dart: '3.4'
          - label: swiftpm-transition
            flutter: '3.24.0'
            dart: '3.5'
          - label: dart-3.8
            flutter: '3.32.0'
            dart: '3.8'
          - label: swiftpm-default
            flutter: '3.44.0'
            dart: '3.12'
          - label: latest
            flutter: '3.47.5'
            dart: '3.13'
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: >-
          python3 .github/ci/check_compatibility.py
          --expected-flutter "${{ matrix.flutter }}"
          --expected-dart "${{ matrix.dart }}"
          --label "${{ matrix.label }}"

  build-android:
    name: Build Android example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd example && flutter pub get && flutter build apk

  build-android-consumers:
    name: Android consumer ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            flutter: '3.22.0'
            options: '--minimum --target-sdk 34'
          - label: current-target
            flutter: '3.47.5'
            options: '--target-sdk 37 --compile-minor 0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: python3 .github/ci/build_android_consumer.py "$RUNNER_TEMP/android_consumer" ${{ matrix.options }}
      - name: Verify native Android restart recovery
        if: matrix.label == 'current-target'
        working-directory: ${{ runner.temp }}/android_consumer/android
        run: ./gradlew :restart_app:testDebugUnitTest --tests gabrimatic.info.restart.RestartPluginTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-consumer-${{ matrix.label }}
          path: ${{ runner.temp }}/android_consumer/build/app/outputs/flutter-apk/app-debug.apk

  build-android-agp9:
    name: Build Android on AGP ${{ matrix.agp }} (built-in Kotlin=${{ matrix.built_in_kotlin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: '3.44.0'
            agp: '9.0.1'
            gradle: '9.1.0'
            built_in_kotlin: 'false'
          - flutter: '3.44.0'
            agp: '9.1.0'
            gradle: '9.5.0'
            built_in_kotlin: 'false'
          - flutter: '3.47.5'
            agp: '9.0.1'
            gradle: '9.1.0'
            built_in_kotlin: 'true'
          - flutter: '3.47.5'
            agp: '9.1.0'
            gradle: '9.5.0'
            built_in_kotlin: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      # The example app stays on AGP 8, so a fresh app pins the AGP 9 toolchain
      # instead. Flutter 3.44 exercises the temporary legacy-KGP compatibility
      # path, while Flutter 3.47 exercises the supported built-in Kotlin path.
      - run: flutter create --platforms=android --project-name restart_app_agp9_smoke /tmp/restart_app_agp9_smoke
      - name: Pin AGP ${{ matrix.agp }} and Gradle ${{ matrix.gradle }}
        working-directory: /tmp/restart_app_agp9_smoke/android
        run: |
          settings=$(ls settings.gradle.kts settings.gradle 2>/dev/null | head -1)
          wrapper=gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's|(com\.android\.application"\)? version ")[0-9.]+"|\1${{ matrix.agp }}"|' "$settings"
          sed -i -E 's#gradle-[0-9.]+-(all|bin)\.zip#gradle-${{ matrix.gradle }}-\1.zip#' "$wrapper"
          sed -i -E '/^android\.builtInKotlin=/d' gradle.properties
          echo 'android.builtInKotlin=${{ matrix.built_in_kotlin }}' >> gradle.properties
          grep -qE 'com\.android\.application"\)? version "${{ matrix.agp }}"' "$settings"
          grep -qE 'gradle-${{ matrix.gradle }}-(all|bin)\.zip' "$wrapper"
          grep -qE '^android\.builtInKotlin=${{ matrix.built_in_kotlin }}$' gradle.properties
          cat "$settings" "$wrapper" gradle.properties
      - run: cd /tmp/restart_app_agp9_smoke && flutter pub add restart_app --path "$GITHUB_WORKSPACE"
      - run: cd /tmp/restart_app_agp9_smoke && flutter build apk --debug

  build-web:
    name: Build web example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd example && flutter pub get && flutter build web

  web-runtime:
    name: Browser restart proof (${{ matrix.mode }})
    needs: candidate-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [js, wasm]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/ci/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact
      - name: Prepare the archive consumer
        env:
          RESTART_WEB_MODE: ${{ matrix.mode }}
        run: |
          python3 .github/ci/package_archive.py \
            "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz" \
            --extract "$RUNNER_TEMP/restart-web-package" \
            --manifest "$RUNNER_TEMP/restart-web-$RESTART_WEB_MODE/candidate-manifest.json" \
            --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          package = temporary / 'restart-web-package'
          consumer = temporary / 'restart-web-consumer'
          shutil.copytree(package / 'example', consumer)
          pubspec = consumer / 'pubspec.yaml'
          source = pubspec.read_text()
          dependency = '  restart_app:\n    path: ../\n'
          if source.count(dependency) != 1:
              raise RuntimeError('Expected one example restart_app path dependency')
          pubspec.write_text(source.replace(dependency, '  restart_app:\n    path: ' + json.dumps(str(package)) + '\n'))
          manifest = json.loads((temporary / ('restart-web-' + os.environ['RESTART_WEB_MODE']) / 'candidate-manifest.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('RESTART_PACKAGE_SHA256=' + manifest['archiveSha256'] + '\n')
          PY
      - name: Build the real browser probe
        working-directory: ${{ runner.temp }}/restart-web-consumer
        env:
          RESTART_WEB_MODE: ${{ matrix.mode }}
        run: |
          flutter pub get
          python3 "$GITHUB_WORKSPACE/.github/ci/candidate_package.py" \
            "$PWD" "$RUNNER_TEMP/restart-web-package" --platform web
          if [ "$RESTART_WEB_MODE" = wasm ]; then
            flutter build web -t lib/web_restart_probe.dart --wasm --pwa-strategy=none
          else
            flutter build web -t lib/web_restart_probe.dart --pwa-strategy=none
          fi
          python3 "$GITHUB_WORKSPACE/.github/ci/candidate_package.py" \
            "$PWD" "$RUNNER_TEMP/restart-web-package" --platform web
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/ci
      - name: Verify owned browser cleanup
        run: node --test visibility_browser.test.mjs
        working-directory: .github/ci
      - name: Install isolated test browsers
        working-directory: .github/ci
        env:
          RESTART_WEB_MODE: ${{ matrix.mode }}
        run: |
          if [ "$RESTART_WEB_MODE" = js ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Verify reloads, routes, history and opaque frames
        run: npm run test:web
        working-directory: .github/ci
        env:
          RESTART_WEB_MODE: ${{ matrix.mode }}
          RESTART_WEB_BUILD: ${{ runner.temp }}/restart-web-consumer/build/web
          RESTART_WEB_RESULTS: ${{ runner.temp }}/restart-web-${{ matrix.mode }}
      - name: Verify hidden-tab reload and visible return
        run: xvfb-run -a npx playwright test --config playwright.config.mjs --workers 1 --repeat-each 1 --grep 'tab switch'
        working-directory: .github/ci
        env:
          RESTART_WEB_MODE: ${{ matrix.mode }}
          RESTART_WEB_HEADED: '1'
          RESTART_WEB_BUILD: ${{ runner.temp }}/restart-web-consumer/build/web
          RESTART_WEB_RESULTS: ${{ runner.temp }}/restart-web-${{ matrix.mode }}-visibility
      - name: Verify the package stayed unchanged
        if: always()
        env:
          RESTART_WEB_MODE: ${{ matrix.mode }}
        run: |
          python3 .github/ci/package_archive.py \
            "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz" \
            --manifest "$RUNNER_TEMP/restart-web-$RESTART_WEB_MODE/candidate-after-runtime.json" \
            --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json" \
            --verify-dir "$RUNNER_TEMP/restart-web-package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restart-web-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/restart-web-${{ matrix.mode }}
            ${{ runner.temp }}/restart-web-${{ matrix.mode }}-visibility
          if-no-files-found: warn

  build-linux:
    name: Build Linux example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter create --platforms=linux /tmp/restart_app_linux_smoke
      - run: cd /tmp/restart_app_linux_smoke && flutter pub add restart_app --path "$GITHUB_WORKSPACE"
      - run: cd /tmp/restart_app_linux_smoke && flutter build linux

  build-macos-ios:
    name: Build macOS and iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: cd example && flutter pub get && flutter build ios --no-codesign
      - run: flutter create --platforms=macos /tmp/restart_app_macos_smoke
      - run: cd /tmp/restart_app_macos_smoke && flutter pub add restart_app --path "$GITHUB_WORKSPACE"
      - run: cd /tmp/restart_app_macos_smoke && flutter build macos

  build-darwin-dependency-managers:
    name: Build iOS and macOS with ${{ matrix.manager }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager: CocoaPods
            flutter: '3.47.5'
            config: '--no-enable-swift-package-manager'
            project: restart_app_cocoapods
            verification: CocoaPods
          - manager: SwiftPM-legacy
            flutter: '3.27.0'
            config: '--enable-swift-package-manager'
            project: restart_app_swiftpm_legacy
            verification: SwiftPM
          - manager: SwiftPM
            flutter: '3.47.5'
            config: '--enable-swift-package-manager'
            project: restart_app_swiftpm
            verification: SwiftPM
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter config ${{ matrix.config }}
      - name: Create native consumer
        run: >-
          flutter create --platforms=ios,macos
          --project-name ${{ matrix.project }}
          "$RUNNER_TEMP/${{ matrix.project }}"
      - name: Set the consumer's minimum macOS deployment target
        run: python3 .github/ci/check_apple_dependency_manager.py "$RUNNER_TEMP/${{ matrix.project }}" --prepare
      - name: Add restart_app and build both Apple platforms
        run: |
          cd "$RUNNER_TEMP/${{ matrix.project }}"
          flutter pub add restart_app --path "$GITHUB_WORKSPACE"
          flutter build ios --no-codesign
          flutter build macos
      - name: Verify the dependency manager compiled restart_app
        run: python3 .github/ci/check_apple_dependency_manager.py "$RUNNER_TEMP/${{ matrix.project }}" --manager "${{ matrix.verification }}"

  ios-runner-tests:
    name: Native iOS RunnerTests on simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter config --enable-swift-package-manager
      - name: Generate the example iOS project
        run: cd example && flutter pub get && flutter build ios --no-codesign --config-only
      - name: Select an available iPhone simulator
        run: |
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$simulator_id"
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Run native RunnerTests
        run: >-
          xcodebuild test
          -workspace example/ios/Runner.xcworkspace
          -scheme Runner
          -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID"
          CODE_SIGNING_ALLOWED=NO

  build-windows:
    name: Build Windows example
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows "$env:RUNNER_TEMP\restart_app_windows_smoke"
      - run: flutter pub add restart_app --path "$env:GITHUB_WORKSPACE"
        working-directory: ${{ runner.temp }}\restart_app_windows_smoke
      - run: flutter build windows
        working-directory: ${{ runner.temp }}\restart_app_windows_smoke

  windows-native-tests:
    name: Windows native relaunch failures
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S windows/tests -B "$env:RUNNER_TEMP\restart_native_tests"
      - run: cmake --build "$env:RUNNER_TEMP\restart_native_tests" --config Release
      - run: ctest --test-dir "$env:RUNNER_TEMP\restart_native_tests" -C Release --output-on-failure

  run-linux:
    name: Linux restart proof
    needs: candidate-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Extract and verify the shared candidate
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --extract "$RUNNER_TEMP/restart_app_candidate"
          --manifest "$RUNNER_TEMP/desktop-proof/candidate-extracted.json"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev xvfb
      - run: flutter create --platforms=linux --project-name restart_proof "$RUNNER_TEMP/restart_proof"
      - run: flutter pub add restart_app --path "$RUNNER_TEMP/restart_app_candidate"
        working-directory: ${{ runner.temp }}/restart_proof
      - run: cp "$GITHUB_WORKSPACE/.github/ci/restart_proof_main.dart" "$RUNNER_TEMP/restart_proof/lib/main.dart"
      - run: python3 .github/ci/prepare_linux_proof.py "$RUNNER_TEMP/restart_proof"
      - name: Verify the package origin before build
        run: >-
          python3 .github/ci/candidate_package.py "$RUNNER_TEMP/restart_proof"
          "$RUNNER_TEMP/restart_app_candidate" --platform linux
          > "$RUNNER_TEMP/desktop-proof/origin-before-build.txt"
      - run: flutter build linux --release
        working-directory: ${{ runner.temp }}/restart_proof
      - name: Verify the package origin after build
        run: >-
          python3 .github/ci/candidate_package.py "$RUNNER_TEMP/restart_proof"
          "$RUNNER_TEMP/restart_app_candidate" --platform linux
          > "$RUNNER_TEMP/desktop-proof/origin-after-build.txt"
      - name: Verify candidate bytes after build
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --verify-dir "$RUNNER_TEMP/restart_app_candidate"
          --manifest "$RUNNER_TEMP/desktop-proof/candidate-after-build.json"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - name: Stress native restarts and verify fresh state
        run: >-
          xvfb-run -a python3 .github/ci/run_desktop_proof.py
          "$RUNNER_TEMP/restart_proof/build/linux/x64/release/bundle/restart_proof"
          --cycles 30 --output "$RUNNER_TEMP/desktop-proof/desktop-proof.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restart-proof-linux
          path: ${{ runner.temp }}/desktop-proof/
          if-no-files-found: warn

  run-windows:
    name: Windows restart proof
    needs: candidate-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Extract and verify the shared candidate
        run: >-
          python .github/ci/package_archive.py "$env:RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --extract "$env:RUNNER_TEMP/restart_app_candidate"
          --manifest "$env:RUNNER_TEMP/desktop-proof/candidate-extracted.json"
          --expected-manifest "$env:RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - run: flutter create --platforms=windows --project-name restart_proof "$env:RUNNER_TEMP/restart_proof"
      - run: flutter pub add restart_app --path "$env:RUNNER_TEMP/restart_app_candidate"
        working-directory: ${{ runner.temp }}/restart_proof
      - run: Copy-Item "$env:GITHUB_WORKSPACE/.github/ci/restart_proof_main.dart" "lib/main.dart" -Force
        working-directory: ${{ runner.temp }}/restart_proof
      - name: Verify the package origin before build
        run: >-
          python .github/ci/candidate_package.py "$env:RUNNER_TEMP/restart_proof"
          "$env:RUNNER_TEMP/restart_app_candidate" --platform windows
          > "$env:RUNNER_TEMP/desktop-proof/origin-before-build.txt"
      - run: flutter build windows --release
        working-directory: ${{ runner.temp }}/restart_proof
      - name: Verify the package origin after build
        run: >-
          python .github/ci/candidate_package.py "$env:RUNNER_TEMP/restart_proof"
          "$env:RUNNER_TEMP/restart_app_candidate" --platform windows
          > "$env:RUNNER_TEMP/desktop-proof/origin-after-build.txt"
      - name: Verify candidate bytes after build
        run: >-
          python .github/ci/package_archive.py "$env:RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --verify-dir "$env:RUNNER_TEMP/restart_app_candidate"
          --manifest "$env:RUNNER_TEMP/desktop-proof/candidate-after-build.json"
          --expected-manifest "$env:RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - name: Stress native restarts and verify fresh state
        run: >-
          python .github/ci/run_desktop_proof.py
          "$env:RUNNER_TEMP/restart_proof/build/windows/x64/runner/Release/restart_proof.exe"
          --cycles 30 --output "$env:RUNNER_TEMP/desktop-proof/desktop-proof.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restart-proof-windows
          path: ${{ runner.temp }}/desktop-proof/
          if-no-files-found: warn

  run-macos:
    name: macOS restart proof
    needs: candidate-package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - name: Extract and verify the shared candidate
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --extract "$RUNNER_TEMP/restart_app_candidate"
          --manifest "$RUNNER_TEMP/desktop-proof/candidate-extracted.json"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - run: flutter create --platforms=macos --project-name restart_proof "$RUNNER_TEMP/restart_proof"
      - run: flutter pub add restart_app --path "$RUNNER_TEMP/restart_app_candidate"
        working-directory: ${{ runner.temp }}/restart_proof
      - run: cp "$GITHUB_WORKSPACE/.github/ci/restart_proof_main.dart" "$RUNNER_TEMP/restart_proof/lib/main.dart"
      - name: Verify the package origin before build
        run: >-
          python3 .github/ci/candidate_package.py "$RUNNER_TEMP/restart_proof"
          "$RUNNER_TEMP/restart_app_candidate" --platform macos
          > "$RUNNER_TEMP/desktop-proof/origin-before-build.txt"
      - run: flutter build macos --debug
        working-directory: ${{ runner.temp }}/restart_proof
      - name: Verify the package origin after build
        run: >-
          python3 .github/ci/candidate_package.py "$RUNNER_TEMP/restart_proof"
          "$RUNNER_TEMP/restart_app_candidate" --platform macos
          > "$RUNNER_TEMP/desktop-proof/origin-after-build.txt"
      - name: Verify candidate bytes after build
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --verify-dir "$RUNNER_TEMP/restart_app_candidate"
          --manifest "$RUNNER_TEMP/desktop-proof/candidate-after-build.json"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
      - name: Stress native restarts and verify fresh state
        run: >-
          python3 .github/ci/run_desktop_proof.py
          "$RUNNER_TEMP/restart_proof/build/macos/Build/Products/Debug/restart_proof.app"
          --cycles 30 --output "$RUNNER_TEMP/desktop-proof/desktop-proof.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restart-proof-macos
          path: ${{ runner.temp }}/desktop-proof/
          if-no-files-found: warn

  kotlin-format:
    name: Kotlin format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint && chmod +x ktlint
      - run: ./ktlint 'android/src/main/kotlin/**/*.kt' 'android/src/test/kotlin/**/*.kt'

  swift-format:
    name: Swift format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: xcrun swift-format lint --recursive ios/restart_app/Sources/ macos/restart_app/Sources/

  cpp-format:
    name: C++ format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get install -y clang-format
      - run: clang-format --dry-run --Werror linux/*.cc linux/*.h windows/*.cpp windows/*.h
      - name: Check bounded Linux argument ownership with sanitizers
        run: |
          clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -g linux/restart_app_argv.cc linux/restart_app_argv_test.cc -o /tmp/restart_app_argv_test
          /tmp/restart_app_argv_test

  skills:
    name: Package skills
    needs: candidate-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: candidate-package
          path: ${{ runner.temp }}/candidate-artifact/
      - name: Extract and verify the publication candidate
        run: |
          mkdir -p "$RUNNER_TEMP/skills-proof"
          python3 .github/ci/package_archive.py \
            "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz" \
            --extract "$RUNNER_TEMP/restart_app_candidate" \
            --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json" \
            --manifest "$RUNNER_TEMP/skills-proof/candidate-before.json"
      - name: Install bundled skills twice and analyze their examples
        run: |
          set -o pipefail
          python3 .github/ci/check_skills.py \
            --package-dir "$RUNNER_TEMP/restart_app_candidate" \
            2>&1 | tee "$RUNNER_TEMP/skills-proof/skills.log"
      - name: Verify the candidate remained unchanged
        run: >-
          python3 .github/ci/package_archive.py "$RUNNER_TEMP/candidate-artifact/restart_app-candidate.tar.gz"
          --verify-dir "$RUNNER_TEMP/restart_app_candidate"
          --expected-manifest "$RUNNER_TEMP/candidate-artifact/candidate-payload.json"
          --manifest "$RUNNER_TEMP/skills-proof/candidate-after.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: skills-proof
          path: ${{ runner.temp }}/skills-proof/
          if-no-files-found: warn

  publish-check:
    name: Publish check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart pub publish --dry-run
