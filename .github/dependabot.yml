version: 2

updates:
  # Keep the package's published constraints as wide as they are; only move
  # them when a release needs a newer version.
  - package-ecosystem: pub
    directory: /
    versioning-strategy: increase-if-necessary
    schedule:
      interval: monthly
    groups:
      pub:
        patterns: ['*']

  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: monthly
    groups:
      pub-example:
        patterns: ['*']

  # No Gradle updates. The plugin's AGP, Kotlin and Robolectric versions are
  # deliberate minimums, and the example's Android toolchain follows the Flutter
  # app template, which caps AGP, Gradle and Kotlin at the versions Flutter supports.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /.github/ci
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: pip
    directory: /.github/ci
    schedule:
      interval: monthly
    groups:
      pip:
        patterns: ['*']
