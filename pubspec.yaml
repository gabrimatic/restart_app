name: restart_app
description: Restart Flutter apps on Android, iOS, web, macOS, Linux, and Windows. Supports app relaunch, iOS engine restart, and bundled AI agent skills.
version: 1.10.1
homepage: https://gabrimatic.github.io/restart_app/
documentation: https://gabrimatic.github.io/restart_app/
repository: https://github.com/gabrimatic/restart_app
issue_tracker: https://github.com/gabrimatic/restart_app/issues
topics:
  - restart
  - app-lifecycle
  - flutter-plugin
  - agent-skills
funding:
  - https://www.buymeacoffee.com/gabrimatic

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  yaml: ^3.1.3

flutter:
  plugin:
    platforms:
      android:
        package: gabrimatic.info.restart
        pluginClass: RestartPlugin
      ios:
        pluginClass: RestartAppPlugin
      web:
        pluginClass: RestartWeb
        fileName: restart_web.dart
      linux:
        pluginClass: RestartAppPlugin
      macos:
        pluginClass: RestartAppPlugin
      windows:
        pluginClass: RestartAppPluginCApi
